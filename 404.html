<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8" />
		<title>Big Aunt's | 大阿姨球員卡團拆</title>
		<script type="text/javascript">
			// Single Page Apps for GitHub Pages
			// https://github.com/rafgraph/spa-github-pages
			// GitHub Pages 是純靜態伺服器，不認得 Angular 前端路由，
			// 對任何找不到實體檔案的路徑（如 /bigaunt/BAS-050）一律回傳這個 404.html。
			// 這裡把「真實路徑」編碼進 query string，導回 baseHref 根目錄的 index.html，
			// 讓 index.html 裡的還原腳本把網址還原、Angular Router 再重新接手。
			(function (l) {
				// baseHref 是 /bigaunt/，所以要保留的固定路徑段數是 1 (bigaunt)
				var pathSegmentsToKeep = 1;

				l.replace(
					l.protocol +
						'//' +
						l.hostname +
						(l.port ? ':' + l.port : '') +
						l.pathname
							.split('/')
							.slice(0, 1 + pathSegmentsToKeep)
							.join('/') +
						'/?/' +
						l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
						(l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
						l.hash,
				);
			})(window.location);
		</script>
	</head>
	<body></body>
</html>
